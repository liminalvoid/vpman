services:
  vpn-manager:
    image: ghcr.io/liminalvoid/vpn-manager:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 30s
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role != manager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healtz"]
      interval: 10s
      timeout: 5s
      retries: 3

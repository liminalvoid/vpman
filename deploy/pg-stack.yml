# Four Patroni-managed Postgres members: one leader, three streaming replicas,
# one per VPS. Patroni holds the leader lock in etcd and promotes a replica on
# its own when the leader's node disappears.
#
#   docker stack deploy -c deploy/pg-stack.yml pg
#
# Each member is PINNED to its node by label and that is deliberate. The data
# lives in a node-local volume, so a member must never be rescheduled onto a
# different node — it would come up against an empty data directory and clone
# itself from scratch. If a node is gone, its member stays down until the node
# is back. Availability comes from the other three, not from moving this one.

x-patroni: &patroni
  image: ghcr.io/liminalvoid/patroni-pg17:latest
  networks:
    - vpn-net
  configs:
    - source: patroni_yml
      target: /etc/patroni/patroni.yml
    - source: patroni_post_init
      target: /etc/patroni/post_init.sh
      mode: 0555
    - source: patroni_bootstrap_sql
      target: /etc/patroni/bootstrap.sql
    - source: app_schema_sql
      target: /etc/patroni/schema.sql
  secrets:
    - pg_superuser_password
    - pg_replication_password
    - pg_app_password
  healthcheck:
    # /liveness = "Patroni itself is running", not "this member is the leader".
    # /health would fail on a replica that is legitimately catching up and get
    # it restarted mid-recovery.
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8008/liveness"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 120s
  stop_grace_period: 60s

x-patroni-deploy: &patroni-deploy
  replicas: 1
  endpoint_mode: dnsrr
  restart_policy:
    condition: any
    delay: 10s
  update_config:
    order: stop-first
    delay: 60s

services:
  pg1:
    <<: *patroni
    hostname: pg1
    environment:
      PATRONI_NAME: pg1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
    volumes:
      - pg1-data:/var/lib/postgresql/data
    deploy:
      <<: *patroni-deploy
      placement:
        constraints:
          - node.labels.pgnode == 1

  pg2:
    <<: *patroni
    hostname: pg2
    environment:
      PATRONI_NAME: pg2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
    volumes:
      - pg2-data:/var/lib/postgresql/data
    deploy:
      <<: *patroni-deploy
      placement:
        constraints:
          - node.labels.pgnode == 2

  pg3:
    <<: *patroni
    hostname: pg3
    environment:
      PATRONI_NAME: pg3
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg3:5432
    volumes:
      - pg3-data:/var/lib/postgresql/data
    deploy:
      <<: *patroni-deploy
      placement:
        constraints:
          - node.labels.pgnode == 3

  pg4:
    <<: *patroni
    hostname: pg4
    environment:
      PATRONI_NAME: pg4
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg4:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg4:5432
    volumes:
      - pg4-data:/var/lib/postgresql/data
    deploy:
      <<: *patroni-deploy
      placement:
        constraints:
          - node.labels.pgnode == 4

volumes:
  pg1-data:
  pg2-data:
  pg3-data:
  pg4-data:

# Swarm configs are immutable. To change one of these files, bump the _vN
# suffix and redeploy — Docker will not update a config in place.
configs:
  patroni_yml:
    file: ./patroni/patroni.yml
    name: patroni_yml_v1
  patroni_post_init:
    file: ./patroni/post_init.sh
    name: patroni_post_init_v1
  patroni_bootstrap_sql:
    file: ./patroni/bootstrap.sql
    name: patroni_bootstrap_sql_v1
  app_schema_sql:
    file: ../schema.sql
    name: app_schema_sql_v1

secrets:
  pg_superuser_password:
    external: true
  pg_replication_password:
    external: true
  pg_app_password:
    external: true

networks:
  vpn-net:
    external: true
